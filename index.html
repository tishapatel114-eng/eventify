<!-- ================= GUEST LIST ================= -->

<hr>

<h2>Guest List</h2>

<form id="guestForm">

    <label>Guest Name:</label>
    <br>

    <input
        type="text"
        id="guestName"
        placeholder="Enter guest name"
    >

    <br><br>


    <label>Contact Number:</label>
    <br>

    <input
        type="tel"
        id="guestContact"
        placeholder="Enter contact number"
    >

    <br><br>


    <label>Number of Guests:</label>
    <br>

    <input
        type="number"
        id="guestCount"
        placeholder="Enter number of guests"
        min="1"
    >

    <br><br>


    <label>RSVP Status:</label>
    <br>

    <select id="rsvpStatus">

        <option value="">
            Select RSVP Status
        </option>

        <option value="Confirmed">
            Confirmed
        </option>

        <option value="Pending">
            Pending
        </option>

        <option value="Declined">
            Declined
        </option>

    </select>

    <br><br>


    <button type="submit">
        Add Guest
    </button>

</form>

<div id="guestResult"></div>
